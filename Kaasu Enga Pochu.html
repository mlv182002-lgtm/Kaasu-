async function pH(p){const s='kep:'+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}
function pLock(){if(!PN)return;LK=1;if(window.speechSynthesis)speechSynthesis.cancel();$('lk').style.display='flex';$('lp').value='';$('le').textContent='';$('lf').textContent='Forgot PIN?';FG=0;setTimeout(()=>$('lp').focus(),60)}
async function pTry(){if(await pH($('lp').value)==PN){LK=0;FL=0;$('lk').style.display='none';R()}else{FL++;$('le').textContent=FL>2?'Wrong PIN ('+FL+' tries) 😅':'Wrong PIN';$('lp').value=''}}
function pForgot(){if(!FG){FG=1;$('lf').textContent='Tap again to ERASE data on this device (restore from your backup file)';return}try{localStorage.removeItem('kep2');localStorage.removeItem('kep_pin')}catch(e){}location.reload()}
async function pSet(){const a=$('p1').value,b=$('p2')?$('p2').value:a;if(!/^\d{4,8}$/.test(a))return toast('PIN must be 4–8 digits');if(a!=b)return toast('PINs do not match');
 if(PN&&await pH($('p0').value)!=PN)return toast('Current PIN is wrong');const h=await pH(a);try{localStorage.setItem('kep_pin',h)}catch(e){return toast('Could not store the PIN in this browser')}PN=h;toast('🔒 PIN saved');R()}
async function pOff(){if(await pH($('p0').value)!=PN)return toast('Enter your current PIN to remove it');PN='';try{localStorage.removeItem('kep_pin')}catch(e){}toast('PIN removed');R()}
function pinCard(){const on=!!PN,ip=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" maxlength="8" placeholder="${ph}" style="width:130px">`;
 return`<div class="c"><h2>🔒 App PIN lock</h2><p class="mu">${on?'PIN is ON. The app asks for it when opened.':'Add a PIN so nobody can open your money details.'}</p>
 ${on?`<div class="r"><button class="b" onclick="pLock()">Lock now</button> Auto-lock <select onchange="try{localStorage.setItem('kep_pl',this.value)}catch(e){}toast('Auto-lock updated')">${[[0,'As soon as I leave the app'],[1,'After 1 min away'],[5,'After 5 min away'],[15,'After 15 min away'],[-1,'Only when I open the app']].map(a=>`<option value="${a[0]}" ${pl()==a[0]?'selected':''}>${a[1]}`).join('')}</select></div>
 <div class="r">${ip('p0','Current PIN')}${ip('p1','New PIN')}${ip('p2','Repeat new')}</div><div class="r"><button class="s" onclick="pSet()">Change PIN</button><button class="s" onclick="pOff()">Remove PIN</button></div>`
 :`<div class="r">${ip('p1','New PIN (4–8 digits)')}${ip('p2','Repeat PIN')}<button class="b" onclick="pSet()">Set PIN</button></div>`}
 <small>This is a privacy screen lock, not encryption. The PIN is stored only on this device and is not included in backups, and backup files are not PIN-protected, so keep them safe. Forgot it? Use "Forgot PIN?" on the lock screen: it erases this device's data, then restore from a backup file.</small></div>`}
document.addEventListener('visibilitychange',()=>{if(!PN)return;if(document.hidden)HID=Date.now();else{if(pl()>=0&&HID&&Date.now()-HID>=pl()*60000)pLock();HID=0}});
if(PN)pLock();
R();
</script></body></html>
